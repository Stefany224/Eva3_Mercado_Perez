openapi: 3.0.0
info:
  title: API ClienteFeliz / ProviEmplea - OMIL
  description: Sistema de intermediación laboral inclusiva con soporte para Currículum Ciego y Búsqueda Inversa de perfiles.
  version: 1.0.0
servers:
  - url: http://localhost/ProviEmplea/Controller
    description: Servidor de Desarrollo Local (XAMPP)

paths:
  /c_usuario.php:
    post:
      summary: Registro Centralizado de Usuarios (Postulantes y Empresas)
      description: Endpoint unificado que gestiona la creación de credenciales en 'login_usuario' y distribuye los perfiles a 'usuario' o 'empresas' de forma transaccional.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer app.public
          description: Token público global para permitir el autoregistro en la plataforma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tipo_registro
                - correo
                - contrasena
              properties:
                tipo_registro:
                  type: string
                  enum: [persona, empresa]
                  example: persona
                  description: Define qué tipo de usuario se está registrando para bifurcar la lógica en cascada.
                correo:
                  type: string
                  example: stefany.test@gmail.com
                contrasena:
                  type: string
                  example: clave123
                rut:
                  type: integer
                  example: 19876543
                  description: Requerido solo si tipo_registro es 'persona'.
                nombre:
                  type: string
                  example: "Stefany"
                apellido_paterno:
                  type: string
                  example: "Silva"
                apellido_materno:
                  type: string
                  example: "Carrasco"
                telefono:
                  type: string
                  example: "+56911112222"
                comuna:
                  type: string
                  example: "Providencia"
                rut_empresa:
                  type: string
                  example: "76.888.999-K"
                  description: Requerido solo si tipo_registro es 'empresa'.
                nombre_empresa:
                  type: string
                  example: "Tech Solutions EST"
                rubro:
                  type: string
                  example: "Tecnología"
                tipo_empresa:
                  type: string
                  example: "EST"
                beneficios:
                  type: string
                  example: "Seguro complementario y modalidad híbrida"
                nombre_contacto:
                  type: string
                  example: "Carlos Reclutador"
                telefono_contacto:
                  type: string
                  example: "+56933334444"
      responses:
        '201':
          description: Cuenta y perfil creados con éxito en la base de datos relacional.
        '400':
          description: Faltan parámetros obligatorios para el tipo de registro seleccionado.
        '401':
          description: Token de inicialización (app.public) ausente o erróneo.
        '500':
          description: Error interno del servidor (RUT o Correo ya registrados).

  /c_candidato.php:
    get:
      summary: Obtener el perfil y porcentaje de avance del candidato
      description: Permite al postulante consultar el estado de su ficha utilizando su RUT.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer candidato.get
          description: Token de autenticación del candidato
        - name: rut
          in: query
          required: true
          schema:
            type: integer
          description: RUT del postulante (sin puntos ni guion)
      responses:
        '200':
          description: Datos del perfil obtenidos con éxito.
        '401':
          description: Sin autorización o token inválido.
        '404':
          description: Candidato no encontrado.

    post:
      summary: Gestionar datos del CV Ciego (Experiencia o Competencia)
      description: Permite al candidato logueado inyectar dinámicamente bloques a su currículum (experiencias laborales o habilidades técnicas).
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer candidato.post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accion
                - id_cv
              properties:
                accion:
                  type: string
                  enum: [experiencia, competencia]
                  example: experiencia
                id_cv:
                  type: integer
                  example: 1
                empresa_anonima:
                  type: string
                  example: "Empresa de Servicios Logísticos"
                cargo:
                  type: string
                  example: "Analista de Base de Datos"
                meses_experiencia:
                  type: integer
                  example: 18
                descripcion_funciones:
                  type: string
                  example: "Diseño de modelos relacionales, consultas SQL y control de calidad de datos."
                nombre_competencia:
                  type: string
                  example: "PHP / Programación Backend"
                nivel:
                  type: string
                  example: "Avanzado"
      responses:
        '201':
          description: Bloque curricular añadido correctamente al CV Ciego.
        '400':
          description: Campos inválidos o acción no soportada.

  /c_empresa.php:
    get:
      summary: Búsqueda Inversa de Candidatos (Filtros Avanzados y CV Ciego)
      description: Endpoint utilizado por las empresas para filtrar talentos en base a criterios profesionales, retornando registros anonimizados con código ciego.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer reclutador.get
        - name: comuna
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por comuna de residencia del postulante
        - name: nivel_educacional
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por nivel de estudios (Universitario, Técnico, etc.)
        - name: carrera
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por nombre de carrera o especialidad
      responses:
        '200':
          description: Listado de perfiles ciegos que coinciden con los filtros.

  /c_administrador.php:
    get:
      summary: Panel General de Intermediación Municipal (OMIL)
      description: Endpoint exclusivo del Administrador Municipal para levantar la alerta de matches y auditar datos reales de contacto.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer admin.get
      responses:
        '200':
          description: Retorna el árbol completo de solicitudes cruzando empresas con candidatos reales.

    patch:
      summary: Registrar Bitácora de Seguimiento y Cambiar Estado de Selección
      description: Registra las acciones del ejecutivo municipal (llamadas, agendamiento de entrevistas) y actualiza el flujo transaccional.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
            default: Bearer admin.patch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_solicitud
                - autor_rol
                - comentario
                - nuevo_estado_proceso
              properties:
                id_solicitud:
                  type: integer
                  example: 1
                autor_rol:
                  type: string
                  example: "Ejecutivo OMIL"
                comentario:
                  type: string
                  example: "Se llama al vecino. Indica que está disponible y le acomoda la jornada."
                nuevo_estado_proceso:
                  type: integer
                  example: 6
                  description: ID del nuevo estado de la solicitud de contacto (4=Contactado, 5=Entrevista, 6=Seleccionado, 7=No seleccionado).
      responses:
        '200':
          description: Historial de seguimiento actualizado correctamente.
        '400':
          description: Faltan campos obligatorios en el JSON o el ID de estado es inválido.